<section class="border-b border-gray-200 bg-white/95 backdrop-blur shadow-sm">
  <div class="mx-auto max-w-6xl px-4 py-3">
    <div class="flex items-center justify-between gap-3">
      <div>
        <div class="text-sm font-semibold text-gray-900">Search Archive</div>
        <div class="text-xs text-gray-500">
          {{ activeFilterCount() ? activeFilterCount() + ' filters active' : 'Search by file, mediatype, or keywords' }}
        </div>
      </div>

      <button
        type="button"
        class="rounded-full border border-gray-300 px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-50"
        (click)="toggleExpanded()"
      >
        {{ expanded ? 'Hide filters' : 'Show filters' }}
      </button>
    </div>

    <form class="mt-3 flex flex-col gap-3 md:flex-row md:items-center" (ngSubmit)="submit()">
      <input
        [(ngModel)]="query"
        name="query"
        type="search"
        aria-label="Search Internet Archive"
        placeholder="Search Internet Archive"
        class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-gray-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
      />

      <div class="flex gap-2 md:ml-auto">
        <button
          type="submit"
          class="rounded-xl bg-blue-600 px-4 py-2.5 font-medium text-white hover:bg-blue-700"
        >
          Search
        </button>
        <button
          type="button"
          class="rounded-xl border border-gray-300 px-4 py-2.5 font-medium text-gray-700 hover:bg-gray-50"
          (click)="resetAll()"
        >
          Reset
        </button>
      </div>
    </form>

    <div *ngIf="expanded" class="mt-4 rounded-2xl border border-gray-200 bg-gray-50 p-4">
      <div class="flex items-center justify-between gap-3">
        <div>
          <div class="text-sm font-semibold text-gray-900">Filters</div>
          <div class="text-xs text-gray-500">Pick one or more mediatypes to narrow results.</div>
        </div>
        <button type="button" class="text-sm text-blue-600 hover:text-blue-700" (click)="clearFilters()">
          Clear filters
        </button>
      </div>

      <div class="mt-3 flex flex-wrap gap-2">
        <label *ngFor="let m of mediaTypes" class="inline-flex cursor-pointer items-center gap-2 rounded-full border px-3 py-1.5 text-sm transition" [class.border-blue-500]="selectedMedia[m]" [class.bg-blue-50]="selectedMedia[m]" [class.text-blue-700]="selectedMedia[m]" [class.border-gray-300]="!selectedMedia[m]" [class.text-gray-700]="!selectedMedia[m]">
          <input type="checkbox" [checked]="selectedMedia[m]" (change)="toggleMedia(m)" class="sr-only" />
          <span class="capitalize">{{ m }}</span>
        </label>
      </div>
    </div>
  </div>
</section>
