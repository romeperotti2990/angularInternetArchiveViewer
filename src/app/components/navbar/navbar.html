<nav class="flex items-center gap-3 p-3 bg-gray-900 text-white">
  <a routerLink="/" class="text-gray-100 no-underline font-semibold">Home</a>
  <div class="text-gray-100">
    <span class="font-semibold">Last items:</span>
    <ng-container *ngIf="limitedLastItems.length; else noLast">
      <span *ngFor="let it of limitedLastItems; let i = index">
        <a href="#" (click)="$event.preventDefault(); openLastItem(it)" class="ml-2 text-gray-100 no-underline">{{ it.label }}</a>
        <span *ngIf="i < limitedLastItems.length - 1" class="text-gray-400">,</span>
      </span>
      <a *ngIf="hasMoreItems" routerLink="/" class="ml-3 text-gray-300 text-sm">(+{{ totalItemsCount - 4 }} more)</a>
    </ng-container>
    <ng-template #noLast>
      <span class="ml-2 text-gray-300">(none)</span>
    </ng-template>
  </div>

  <div class="ml-auto">
    <input
      #q
      type="search"
      aria-label="Search Internet Archive"
      placeholder="Search Internet Archive"
      class="px-2 py-1 rounded text-black bg-white w-64"
      (keydown.enter)="onSearch(q.value)"
    />
    <div class="inline-block ml-3 align-middle">
      <div class="text-xs text-gray-200">Media</div>
      <div class="flex gap-2">
        <label *ngFor="let m of mediaTypes" class="flex items-center text-xs">
          <input type="checkbox" [checked]="selectedMedia[m]" (change)="toggleMediaAndSync(m)" class="mr-1" />
          <span class="capitalize">{{ m }}</span>
        </label>
      </div>
    </div>
  </div>
</nav>
