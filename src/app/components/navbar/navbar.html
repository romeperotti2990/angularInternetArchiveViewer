<nav class="flex items-center gap-3 p-3 bg-gray-900 text-white">
  <a routerLink="/" class="text-gray-100 text-2xl pl-2 p-1 no-underline font-semibold">IAV</a>
  <div class="text-gray-100">
    <span class="font-semibold">Last items:</span>
    <ng-container *ngIf="limitedLastItems.length; else noLast">
      <span *ngFor="let it of limitedLastItems; let i = index">
        <a href="#" (click)="$event.preventDefault(); openLastItem(it)" class="ml-2 text-gray-100 no-underline">
          {{ it.collectionTitle || it.label }}
        </a>
        <button
          class="ml-1 text-gray-100 text-sm align-middle"
          (click)="$event.preventDefault(); $event.stopPropagation(); favorites.toggle('history::' + it.url)"
          title="{{ favorites.isFavorited('history::' + it.url) ? 'Unfavorite' : 'Favorite' }}"
        >
          {{ favorites.isFavorited('history::' + it.url) ? '★' : '☆' }}
        </button>
        <span *ngIf="i < limitedLastItems.length - 1" class="text-gray-400">,</span>
      </span>
      <a *ngIf="hasMoreItems" routerLink="/" class="ml-3 text-gray-300 text-sm">(+{{ totalItemsCount - 4 }} more)</a>
    </ng-container>
    <ng-template #noLast>
      <span class="ml-2 text-gray-300">(none)</span>
    </ng-template>
  </div>
  <div class="ml-auto flex items-center gap-3">
    <a routerLink="/login" class="text-gray-300 no-underline">Sign in</a>
    <a routerLink="/signup" class="text-gray-300 no-underline">Sign up</a>
  </div>
</nav>
