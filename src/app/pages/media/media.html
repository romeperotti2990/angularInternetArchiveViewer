<div class="p-4">
  <h2 class="text-xl font-semibold mb-3">Emulator</h2>
  <div *ngIf="error" class="text-red-500 mb-2">{{ error }}</div>

  <div *ngIf="mode === 'emulator' && emulatorUrl">
    <p class="text-sm mb-2">
      Core: <strong>{{ core }}</strong> | Game file:
      <a [href]="gameUrl" target="_blank" rel="noopener noreferrer">{{ gameUrl }}</a>
    </p>
    <div class="border border-gray-300" style="height: 640px;">
      <iframe
        [src]="emulatorUrl"
        width="100%"
        height="100%"
        frameborder="0"
        allowfullscreen
      ></iframe>
    </div>
  </div>

  
</div>
