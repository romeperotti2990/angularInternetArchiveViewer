<div class="max-w-md mx-auto mt-12 p-6 bg-white/5 rounded-lg shadow-md">
	<h2 class="text-2xl font-semibold mb-4">Create account</h2>
	<div *ngIf="error" class="text-red-500 mb-2">{{ error }}</div>
	<div *ngIf="success" class="text-green-500 mb-2">Account created — logged in.</div>

	<label class="block text-sm text-gray-600 mb-1">Display name</label>
	<input class="w-full p-2 mb-3 rounded bg-white text-gray-900 border border-gray-300" [(ngModel)]="displayName" placeholder="Name" />

	<label class="block text-sm text-gray-600 mb-1">Email</label>
	<input class="w-full p-2 mb-3 rounded bg-white text-gray-900 border border-gray-300" [(ngModel)]="email" placeholder="you@example.com" />

	<label class="block text-sm text-gray-600 mb-1">Password</label>
	<input class="w-full p-2 mb-3 rounded bg-white text-gray-900 border border-gray-300" type="password" [(ngModel)]="password" />

	<label class="block text-sm text-gray-600 mb-1">Confirm password</label>
	<input class="w-full p-2 mb-4 rounded bg-white text-gray-900 border border-gray-300" type="password" [(ngModel)]="confirm" />

	<div class="flex gap-3">
		<button class="px-4 py-2 bg-green-600 rounded text-white" (click)="signupLocal()">Create account</button>
		<button class="px-4 py-2 bg-gray-600 rounded text-white" (click)="signInWithGoogle()">Sign up with Google</button>
		<button class="px-4 py-2 bg-gray-500 rounded text-white" (click)="continueAsGuest()">Continue as Guest</button>
	</div>

</div>

<div class="max-w-md mx-auto mt-2 text-center">
	<p class="text-sm text-gray-600">Already have an account? <a routerLink="/login" class="text-blue-600">Sign in</a></p>
</div>
