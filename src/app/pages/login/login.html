<div class="max-w-md mx-auto mt-12 p-6 bg-white/5 rounded-lg shadow-md">
	<h2 class="text-2xl font-semibold mb-4">Sign in</h2>
	<div *ngIf="error" class="text-red-500 mb-2">{{ error }}</div>

	<label class="block text-sm text-gray-600 mb-1">Email</label>
	<input class="w-full p-2 mb-3 rounded bg-white text-gray-900 border border-gray-300" [(ngModel)]="email" placeholder="you@example.com" />

	<label class="block text-sm text-gray-600 mb-1">Password</label>
	<input class="w-full p-2 mb-4 rounded bg-white text-gray-900 border border-gray-300" type="password" [(ngModel)]="password" />

	<div class="flex gap-3">
		<button class="px-4 py-2 bg-blue-600 rounded text-white" (click)="loginLocal()">Sign in</button>
		<button class="px-4 py-2 bg-gray-600 rounded text-white" (click)="continueAsGuest()">Continue as Guest</button>
	</div>

	<p class="mt-3 text-sm text-gray-600">Don't have an account? <a routerLink="/signup" class="text-blue-600">Sign up</a></p>

	<div class="my-4 border-t border-gray-700"></div>
	<button class="w-full px-4 py-2 bg-white text-gray-900 rounded" (click)="signInWithGoogle()">Sign in with Google</button>
</div>
